<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orchestrate Agent Tree</title>
  <style>
    :root { color-scheme: dark; --bg:#090c10; --panel:#111820; --line:#233040; --text:#e6edf3; --muted:#8b98a5; --ok:#45c77a; --warn:#f0b84b; --bad:#ff6b6b; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { max-width:1180px; margin:0 auto; padding:28px; }
    h1 { margin:0 0 18px; font-size:20px; font-weight:650; letter-spacing:0; }
    table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); }
    th, td { padding:9px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    td { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; word-break:break-word; }
    tr.complete td { color:var(--ok); }
    tr.suspect td { color:var(--warn); }
    tr.lost td, tr.LOST td { color:var(--bad); }
    .empty { color:var(--muted); text-align:center; padding:24px; }
  </style>
</head>
<body>
  <main>
    <h1>Orchestrate Agent Tree</h1>
    <table>
      <thead>
        <tr><th>Name</th><th>Role</th><th>Task</th><th>Model</th><th>Lane</th><th>Spawn</th><th>Status</th><th>Terminal</th><th>Updated</th></tr>
      </thead>
      <tbody>
__TABLE_ROWS__
      </tbody>
    </table>
  </main>
  <script type="application/json" id="tree">
__TREE_JSON__
  </script>
</body>
</html>
